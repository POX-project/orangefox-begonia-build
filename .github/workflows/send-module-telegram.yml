name: Send module to Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Download module v1.1
        run: |
          set -euo pipefail
          curl -fsSL -o module.zip \
            "https://github.com/methylphetamine/begonia-volume-buttons-off/releases/download/v1.1/begonia-volume-buttons-off-v1.1.zip"
          echo "313aab618421394c8194b1aae0bb92f9557bbeceeccb7dba69257b0ad4d1629b  module.zip" | sha256sum -c -
          ls -l module.zip

      - name: Resolve destination chat
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured"
            exit 1
          fi
          curl -sS -G --data-urlencode "chat_id=${TG_CHAT}" \
            "https://api.telegram.org/bot${TG_TOKEN}/getChat" -o /tmp/chat.json
          if ! jq -e '.ok == true' /tmp/chat.json >/dev/null; then
            jq . /tmp/chat.json || true
            echo "::error::getChat failed"
            exit 1
          fi
          jq '{id: .result.id, type: .result.type, title: .result.title, username: .result.username, first_name: .result.first_name}' /tmp/chat.json
          jq -r '.result.id' /tmp/chat.json > telegram-chat-id.txt

      - name: Send module zip
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          CAPTION=$(printf 'Begonia Volume Buttons Off v1.1\nSHA256: %s\nRelease: %s\nGofile: %s' \
            "313aab618421394c8194b1aae0bb92f9557bbeceeccb7dba69257b0ad4d1629b" \
            "https://github.com/methylphetamine/begonia-volume-buttons-off/releases/tag/v1.1" \
            "https://gofile.io/d/KZ4SWhsB")
          HTTP=$(curl -sS -o /tmp/tg.json -w '%{http_code}' \
            -F "chat_id=${TG_CHAT}" \
            -F "document=@module.zip;type=application/zip" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument")
          if [ "$HTTP" = "200" ] && jq -e '.ok == true' /tmp/tg.json >/dev/null; then
            echo "Telegram: module zip sent as a document"
          else
            echo "::warning::sendDocument failed (HTTP ${HTTP}); sending a link instead"
            jq . /tmp/tg.json || true
            TEXT=$(printf 'Begonia Volume Buttons Off v1.1\nSHA256: %s\nRelease: %s\nGofile: %s' \
              "313aab618421394c8194b1aae0bb92f9557bbeceeccb7dba69257b0ad4d1629b" \
              "https://github.com/methylphetamine/begonia-volume-buttons-off/releases/tag/v1.1" \
              "https://gofile.io/d/KZ4SWhsB")
            curl -sS -o /tmp/tgmsg.json \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${TEXT}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
            if jq -e '.ok == true' /tmp/tgmsg.json >/dev/null; then
              echo "Telegram: link sent"
            else
              jq . /tmp/tgmsg.json || true
              echo "::error::Telegram delivery failed"
              exit 1
            fi
          fi

      - name: Save chat id for the module repo
        uses: actions/upload-artifact@v4
        with:
          name: telegram-chat-id
          path: telegram-chat-id.txt
          retention-days: 1
