name: storage diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: before
        run: |
          df -h
          df -i /
          lsblk -f
          findmnt -T / -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL
          findmnt -T /mnt -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL
          stat -c '%d %n' / /mnt
      - name: cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    "$AGENT_TOOLSDIRECTORY/CodeQL" "$AGENT_TOOLSDIRECTORY/Python" \
                    /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/libclang* /usr/lib/llvm* /usr/local/lib/gcc* \
                    /usr/lib/gcc* /usr/local/lib/go* /usr/lib/go* \
                    /var/cache/apt/archives/* /tmp/* 2>/dev/null || true
          sudo apt-get clean || true
      - name: after
        run: |
          df -h
          du -xsh /usr /opt /var /home 2>/dev/null || true
