name: storage diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: base cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    "$AGENT_TOOLSDIRECTORY/CodeQL" "$AGENT_TOOLSDIRECTORY/Python" \
                    /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/libclang* /usr/lib/llvm* /usr/local/lib/gcc* \
                    /usr/lib/gcc* /usr/local/lib/go* /usr/lib/go* \
                    /var/cache/apt/archives/* /tmp/* 2>/dev/null || true
          sudo apt-get clean || true
          df -h /
      - name: breakdown
        run: |
          du -xsh /usr/* /opt/* /usr/local/* /var/* /home/runner/* 2>/dev/null | sort -h | tail -60 || true
      - name: extra cleanup
        run: |
          sudo rm -rf /opt/hostedtoolcache /opt/microsoft /opt/az /opt/google \
                    /opt/containerd /opt/pipx \
                    /usr/local/lib/node_modules /usr/local/share/powershell \
                    /usr/local/swift /usr/local/.ghcup /usr/local/aws-cli /usr/local/aws \
                    /usr/share/swift /usr/share/miniconda /usr/share/az_* \
                    /usr/share/grafana /usr/share/kibana /usr/share/doc /usr/share/man \
                    /usr/share/locale /usr/lib/mono /usr/lib/R /usr/lib/postgresql \
                    /usr/lib/mysql /usr/lib/firefox /usr/lib/chromium \
                    /var/lib/docker /var/lib/containerd /var/lib/snapd /var/lib/apt/lists \
                    /home/runner/.cache /home/runner/.npm /home/runner/.dotnet \
                    /home/runner/.rustup /home/runner/.cargo /home/runner/.ghcup \
                    /home/runner/.local/lib || true
          sudo find /usr/lib/jvm -mindepth 1 -maxdepth 1 -type d \
                    ! -name 'temurin-11*' ! -name 'java-11*' -exec rm -rf {} + || true
          df -h /
      - name: after
        run: |
          df -h /
          du -xsh /usr /opt /var /home 2>/dev/null || true
