name: OrangeFox build (begonia)

on:
  workflow_dispatch:
    inputs:
      makefile:
        description: 'Lunch target'
        required: false
        default: 'twrp_begonia-eng'
      build_target:
        description: 'Make target'
        required: false
        default: 'recoveryimage'
      fox_branch:
        description: 'OrangeFox sync branch (12.1 is the supported branch for this tree)'
        required: false
        default: '12.1'
      device_branch:
        description: 'Device tree branch (wifi-browser adds recovery WiFi + dashboard; unified = dynamic+erofs + FBEv2 decryption)'
        required: false
        default: 'wifi-browser'
      jobs:
        description: 'Parallel make jobs'
        required: false
        default: '4'
      ccache:
        description: 'Use ccache (true/false)'
        required: false
        default: 'true'
      publish_release:
        description: 'Create a GitHub release with the image'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FOX_SYNC_URL: 'https://gitlab.com/OrangeFox/sync.git'
  FOX_SYNC_BRANCH: ${{ github.event.inputs.fox_branch || '12.1' }}
  DEVICE_TREE_URL: 'https://github.com/methylphetamine/device_xiaomi_begonia-orangefox.git'
  DEVICE_TREE_BRANCH: ${{ github.event.inputs.device_branch || 'wifi-browser' }}
  SRC_DIR: 'aosp'
  FOX_BUILD_TYPE: 'Unofficial'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'

jobs:
  build:
    name: Compile OrangeFox recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show parameters
        run: |
          echo "OrangeFox  : $FOX_SYNC_URL @ $FOX_SYNC_BRANCH"
          echo "device tree: $DEVICE_TREE_URL @ $DEVICE_TREE_BRANCH"
          echo "lunch      : ${{ inputs.makefile || 'twrp_begonia-eng' }}"
          echo "target     : ${{ inputs.build_target || 'recoveryimage' }}"
          echo "jobs       : ${{ inputs.jobs || '4' }}"
          echo "ccache     : ${{ inputs.ccache || 'true' }}"
          echo "free space before:"
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    "$AGENT_TOOLSDIRECTORY/CodeQL" \
                    "$AGENT_TOOLSDIRECTORY/Python" \
                    /usr/local/share/boost \
                    /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex git git-lfs gnupg patch \
            gcc-multilib g++-multilib \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush python3 rsync schedtool squashfs-tools unzip \
            xz-utils zip zlib1g-dev openjdk-11-jdk-headless jq
          java -version 2>&1

      - name: Set JDK 11
        run: |
          if [ -d "$JAVA_HOME_11_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
            echo "Using preinstalled JDK 11 at $JAVA_HOME_11_X64"
          else
            echo "JDK 11 not preinstalled; relying on openjdk-11-jdk-headless"
          fi
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -version 2>&1

      - name: Add swap (recovery link steps are memory hungry)
        run: |
          echo "=== swap before ==="
          swapon --show || true
          free -h
          sudo timeout 120 swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== swap after ==="
          swapon --show
          free -h

      - name: Install repo launcher
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          repo --version | head -2

      - name: Restore ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-begonia-${{ github.run_id }}
          restore-keys: |
            ccache-begonia-

      - name: ccache configuration
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G
          ccache --zero-stats || true

      - name: Sync OrangeFox sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox-sync"
          git clone --depth=1 "$FOX_SYNC_URL" "$GITHUB_WORKSPACE/fox-sync"
          cd "$GITHUB_WORKSPACE/fox-sync"
          chmod +x ./orangefox_sync.sh
          # googlesource occasionally returns 503 for a single project; the
          # script is resumable, so retry the whole init/sync a few times.
          ok=0
          for attempt in 1 2 3; do
            echo "=== OrangeFox sync attempt $attempt ==="
            if ./orangefox_sync.sh --branch "$FOX_SYNC_BRANCH" --path "$GITHUB_WORKSPACE/$SRC_DIR"; then
              ok=1
              break
            fi
            echo "sync attempt $attempt failed"
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "::error::OrangeFox source sync failed after 3 attempts"
            exit 1
          fi
          echo "--- OrangeFox sources ---"
          ls -la "$GITHUB_WORKSPACE/$SRC_DIR/bootable/recovery" | head
          ls -la "$GITHUB_WORKSPACE/$SRC_DIR/vendor/recovery" | head
          ls -la "$GITHUB_WORKSPACE/$SRC_DIR/vendor/twrp" | head

      - name: Ensure WiFi userspace sources
        run: |
          cd "$GITHUB_WORKSPACE/$SRC_DIR"
          # default.xml lists external/wpa_supplicant_8, but the minimal
          # manifest includes remove-minimal.xml, which removes that project
          # ("remove-project name=platform/external/wpa_supplicant_8").  It is
          # therefore never checked out by repo; clone it at the manifest
          # revision so recovery can build wpa_supplicant/wpa_cli.
          if [ ! -f external/wpa_supplicant_8/wpa_supplicant/android.config ]; then
            echo "external/wpa_supplicant_8 was removed by remove-minimal.xml; cloning it"
            rm -rf external/wpa_supplicant_8
            ok=0
            for attempt in 1 2 3; do
              if git clone --depth=1 -b android-12.1.0_r4 \
                  https://android.googlesource.com/platform/external/wpa_supplicant_8 \
                  external/wpa_supplicant_8; then
                ok=1
                break
              fi
              echo "wpa_supplicant_8 clone attempt $attempt failed"
              rm -rf external/wpa_supplicant_8
              sleep 15
            done
            if [ "$ok" != 1 ]; then
              echo "::error::could not clone external/wpa_supplicant_8"
              exit 1
            fi
          fi

          # These are still in the manifest (remove-minimal.xml does not drop
          # them), but check explicitly so a future manifest change fails here
          # with a clear message instead of somewhere deep in the build.
          for dep in \
              external/libnl \
              system/security/keystore \
              system/security/keystore-engine \
              system/hardware/interfaces/wifi/keystore/1.0; do
            if [ ! -e "$dep" ]; then
              echo "::error::missing WiFi build dependency: $dep"
              exit 1
            fi
          done
          test -f external/wpa_supplicant_8/wpa_supplicant/android.config
          echo "--- WiFi sources OK ---"
          ls -la external/wpa_supplicant_8/wpa_supplicant/android.config
          ls -d external/libnl system/hardware/interfaces/wifi/keystore/1.0

      - name: Clone begonia device tree
        run: |
          rm -rf "$SRC_DIR/device/xiaomi/begonia"
          git clone --depth=1 -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$SRC_DIR/device/xiaomi/begonia"
          test -f "$SRC_DIR/device/xiaomi/begonia/fox_begonia.mk"
          echo "--- device tree ---"
          ls -la "$SRC_DIR/device/xiaomi/begonia"

      - name: Patch wpa_supplicant for recovery
        run: |
          WPA_DIR="$SRC_DIR/external/wpa_supplicant_8"
          CFG="$WPA_DIR/wpa_supplicant/android.config"
          if [ ! -f "$CFG" ]; then
            echo "::error::$CFG is missing"
            ls -la "$WPA_DIR" || true
            ls -la "$WPA_DIR/wpa_supplicant" || true
            exit 1
          fi
          # Recovery has no HIDL wifi service and no keystore2 daemon, so the
          # daemon must expose the classic unix control socket for wpa_cli.
          sed -i 's/^CONFIG_CTRL_IFACE_HIDL=y/#CONFIG_CTRL_IFACE_HIDL=y/' "$CFG"
          if grep -q '^CONFIG_CTRL_IFACE_HIDL=y' "$CFG"; then
            echo "::error::failed to disable CONFIG_CTRL_IFACE_HIDL"
            exit 1
          fi
          grep -n 'CONFIG_CTRL_IFACE' "$CFG" | tail -5

          # notify.c includes "hidl.h" and calls wpas_hidl_* unconditionally,
          # even though AOSP only builds the HIDL implementation when
          # CONFIG_CTRL_IFACE_HIDL is enabled.  With HIDL disabled there is no
          # such header on the include path, so the stock source does not
          # compile.  Provide a recovery-only header in the directory quoted
          # includes search first; it turns every HIDL notification into a
          # no-op.  The daemon then uses the plain unix control socket, which
          # is what wpa_cli needs here.  The real header is still used if the
          # HIDL build option is ever re-enabled.
          REAL_HIDL="$WPA_DIR/wpa_supplicant/hidl/1.4/hidl.h"
          STUB_HIDL="$WPA_DIR/wpa_supplicant/hidl.h"
          test -f "$REAL_HIDL"
          {
            echo '/* Generated by the OrangeFox begonia build: HIDL-disabled shim. */'
            echo '#ifndef WPA_RECOVERY_HIDL_STUB_H'
            echo '#define WPA_RECOVERY_HIDL_STUB_H'
            echo '#ifdef CONFIG_CTRL_IFACE_HIDL'
            echo '#include "hidl/1.4/hidl.h"'
            echo '#else'
            echo 'struct wpas_hidl_priv;'
            echo 'struct wpa_global;'
            echo '#define wpas_hidl_init(...) ((struct wpas_hidl_priv *)0)'
            echo '#define wpas_hidl_deinit(...) ((void)0)'
            # These return int and one call site checks the result.  The
            # helper keeps a bare statement warning-free under -Wunused-value.
            echo 'static inline int wpas_hidl_stub_ok(void) { return 0; }'
            echo '#define wpas_hidl_register_interface(...) wpas_hidl_stub_ok()'
            echo '#define wpas_hidl_unregister_interface(...) wpas_hidl_stub_ok()'
            echo '#define wpas_hidl_register_network(...) wpas_hidl_stub_ok()'
            echo '#define wpas_hidl_unregister_network(...) wpas_hidl_stub_ok()'
            grep -ho 'wpas_hidl_[a-z0-9_]*' "$REAL_HIDL" \
              "$WPA_DIR/wpa_supplicant/notify.c" | sort -u |
              while read -r sym; do
                case "$sym" in
                  wpas_hidl_priv|wpas_hidl_init|wpas_hidl_deinit) continue ;;
                  wpas_hidl_register_interface|wpas_hidl_unregister_interface) continue ;;
                  wpas_hidl_register_network|wpas_hidl_unregister_network) continue ;;
                esac
                printf '#define %s(...) ((void)0)\n' "$sym"
              done
            echo '#endif /* CONFIG_CTRL_IFACE_HIDL */'
            echo '#endif /* WPA_RECOVERY_HIDL_STUB_H */'
          } > "$STUB_HIDL"
          test -s "$STUB_HIDL"
          echo "wrote HIDL shim $STUB_HIDL ($(wc -l < "$STUB_HIDL") lines)"
          test -f "$SRC_DIR/device/xiaomi/begonia/recovery/root/system/bin/foxwifi"
          test -f "$SRC_DIR/device/xiaomi/begonia/recovery/root/init.recovery.wifi.rc"

      - name: Record OrangeFox source revisions
        run: |
          cd "$SRC_DIR"
          echo "=== OrangeFox source revisions ==="
          for d in bootable/recovery vendor/recovery vendor/twrp build/make system/core device/xiaomi/begonia; do
            if [ -d "$d/.git" ]; then
              printf "%-28s %s %s\n" "$d" "$(git -C "$d" rev-parse HEAD)" "$(git -C "$d" log -1 --format=%cs)"
            else
              printf "%-28s %s\n" "$d" "(not a git checkout)"
            fi
          done

      - name: Trim disk before build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          # Drop .git for the largest prebuilt/toolchain trees: they are not
          # needed to build, and this frees roughly 10 GB.
          du -sh "$SRC_DIR" 2>/dev/null || true
          find "$SRC_DIR/prebuilts" -maxdepth 6 -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find "$SRC_DIR/.repo/project-objects" -type d -name '*.git' -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Compile
        env:
          USE_CCACHE: ${{ inputs.ccache || 'true' }}
          ALLOW_MISSING_DEPENDENCIES: 'true'
          BUILD_JOBS: ${{ inputs.jobs || '4' }}
          MAKEFILE_NAME: ${{ inputs.makefile || 'twrp_begonia-eng' }}
          BUILD_TARGET: ${{ inputs.build_target || 'recoveryimage' }}
          BUILD_USERNAME: methylphetamine
          BUILD_HOSTNAME: poxproject
          FOX_BUILD_DEVICE: begonia
          FOX_BUILD_TYPE: Unofficial
        run: |
          cd "$SRC_DIR"
          set -o pipefail
          : > build.log

          # OrangeFox's envsetup hook ends with an optional VTS test and
          # returns 1 when frameworks/base/services/core/xsd/vts/Android.mk
          # is absent (the normal case for the minimal manifest).  The
          # environment is still valid, so do not let `set -e` abort here.
          set +e
          source build/envsetup.sh >> build.log 2>&1
          ENVSETUP_RC=$?
          set -e
          echo "envsetup exited ${ENVSETUP_RC} (1 is expected for OrangeFox's optional VTS cleanup)"
          tail -n 20 build.log || true
          if [ -z "$ANDROID_BUILD_TOP" ]; then
            echo "::error::envsetup did not initialise ANDROID_BUILD_TOP"
            exit 1
          fi

          # Do NOT pipe lunch: a pipeline runs lunch in a subshell, so its
          # exported TARGET_PRODUCT would not reach mka.  mka would then fall
          # back to aosp_arm (no device BoardConfig, no TW_THEME).
          set +e
          lunch "$MAKEFILE_NAME" >> build.log 2>&1
          LUNCH_RC=$?
          set -e
          tail -n 40 build.log || true
          if [ "$LUNCH_RC" -ne 0 ] || [ -z "$TARGET_PRODUCT" ]; then
            echo "::error::lunch failed or did not export TARGET_PRODUCT"
            exit 1
          fi
          export TARGET_PRODUCT TARGET_BUILD_VARIANT TARGET_BUILD_TYPE
          echo "Using TARGET_PRODUCT=$TARGET_PRODUCT TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          mka "$BUILD_TARGET" -j"$BUILD_JOBS" \
            BUILD_USERNAME=methylphetamine \
            BUILD_HOSTNAME=poxproject 2>&1 | tee -a build.log

      - name: Locate and verify output image
        id: image
        run: |
          cd "$SRC_DIR"
          # Guard against a silent relink skip.  external/wpa_supplicant_8 only
          # defines its modules when WPA_SUPPLICANT_VERSION=VER_0_8_X, and
          # relink.sh skips source files that do not exist without failing.
          for f in \
              out/target/product/begonia/vendor/bin/hw/wpa_supplicant \
              out/target/product/begonia/vendor/bin/wpa_cli \
              out/target/product/begonia/recovery/root/system/bin/wpa_supplicant \
              out/target/product/begonia/recovery/root/system/bin/wpa_cli \
              out/target/product/begonia/recovery/root/system/lib64/libkeystore-wifi-hidl.so \
              out/target/product/begonia/recovery/root/system/lib64/libkeystore-engine-wifi-hidl.so; do
            if [ ! -e "$f" ]; then
              echo "::error::missing $f; WiFi userspace was not built or relinked"
              exit 1
            fi
          done
          echo "=== candidate images ==="
          find out/target/product -maxdepth 2 \
            \( -name 'recovery*.img' -o -name 'OrangeFox*.img' -o -name 'OrangeFox*.zip' \) \
            -type f -exec ls -la {} \;
          IMG=$(find out/target/product -maxdepth 2 -type f \
            \( -name 'recovery.img' -o -name 'OrangeFox*.img' \) | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::OrangeFox recovery image was not produced"
            exit 1
          fi
          echo "using: $IMG"
          cp "$IMG" "$GITHUB_WORKSPACE/recovery.img"
          cd "$GITHUB_WORKSPACE"
          echo "=== sha256 / size ==="
          sha256sum recovery.img
          ls -la recovery.img
          SIZE=$(stat -c%s recovery.img)
          LIMIT=67108864
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::recovery.img is $SIZE bytes, larger than the ${LIMIT}-byte partition"
            exit 1
          fi
          echo "fits the recovery partition: $SIZE <= $LIMIT bytes"
          echo "=== avb info ==="
          "$SRC_DIR"/out/host/linux-x86/bin/avbtool info_image --image recovery.img || true
          echo "image_path=recovery.img" >> "$GITHUB_OUTPUT"

      - name: Upload to Gofile
        id: gofile
        if: success()
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          SRV=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty')
          if [ -z "$SRV" ]; then
            echo "::warning::Gofile returned no upload server"
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/gofile.json -w '%{http_code}' \
            -F "file=@recovery.img" "https://${SRV}.gofile.io/contents/uploadfile" || true)
          URL=$(jq -r '.data.downloadPage // empty' /tmp/gofile.json 2>/dev/null || true)
          if [ "$HTTP" != "200" ] || [ -z "$URL" ]; then
            echo "::warning::Gofile upload failed (HTTP ${HTTP:-?})"
            exit 0
          fi
          echo "gofile_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Gofile: $URL"

      - name: Upload to Telegram
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOFILE_URL: ${{ steps.gofile.outputs.gofile_url }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured"
            exit 0
          fi
          SHA=$(sha256sum recovery.img | awk '{print $1}')
          SIZE=$(stat -c%s recovery.img)
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CAPTION=$(printf 'OrangeFox recovery - begonia\nSHA256: %s\nGofile: %s\nRun: %s' \
            "$SHA" "${GOFILE_URL:-n/a}" "$RUN_URL")
          API="https://api.telegram.org/bot${TG_TOKEN}"

          if [ "$SIZE" -le 49000000 ]; then
            curl -sS -o /tmp/tg.json \
              -F "chat_id=${TG_CHAT}" \
              -F "document=@recovery.img" \
              --form-string "caption=${CAPTION}" \
              "${API}/sendDocument" || true
            if jq -e '.ok == true' /tmp/tg.json >/dev/null 2>&1; then
              echo "Telegram: recovery.img sent as a document"
              exit 0
            fi
            echo "::warning::Telegram sendDocument failed; sending a link instead"
          fi

          TEXT=$(printf 'OrangeFox recovery - begonia\nSHA256: %s\nGofile: %s\nRun: %s\nImage size: %s bytes' \
            "$SHA" "${GOFILE_URL:-n/a}" "$RUN_URL" "$SIZE")
          curl -sS -o /tmp/tg.json \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            "${API}/sendMessage" || true
          if jq -e '.ok == true' /tmp/tg.json >/dev/null 2>&1; then
            echo "Telegram: link sent"
          else
            echo "::warning::Telegram notification failed"
          fi

      - name: Notify Telegram on failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -o /tmp/tg.json \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=OrangeFox begonia build FAILED: ${RUN_URL}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" || true

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Dump build logs on failure
        if: failure()
        run: |
          if [ ! -d "$SRC_DIR" ]; then
            echo "source tree '$SRC_DIR' does not exist; nothing to dump"
            exit 0
          fi
          cd "$SRC_DIR"
          echo "=== out/error.log ==="
          cat out/error.log 2>/dev/null || echo "(none)"
          echo
          echo "=== first failing lines from build.log ==="
          grep -n -i -m 60 -E "error:|Error [0-9]+|No rule to make target|FAILED:" build.log 2>/dev/null || echo "(none)"
          echo
          echo "=== tail of build.log ==="
          tail -n 200 build.log 2>/dev/null || true

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-begonia-recovery
          path: recovery.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            $SRC_DIR/build.log
            $SRC_DIR/out/error.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        if: ${{ (inputs.publish_release || false) == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          SHA=$(sha256sum recovery.img | awk '{print $1}')
          TAG="${GITHUB_REF_NAME:-twrp-begonia-$(date +%Y%m%d%H%M%S)}"
          {
            echo "OrangeFox recovery for Redmi Note 8 Pro (begonia)"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- sha256: \`$SHA\`"
            echo "- built by run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-notes.md
          gh release create "$TAG" recovery.img --title "OrangeFox begonia $TAG" \
            --notes-file release-notes.md || \
          gh release upload "$TAG" recovery.img --clobber