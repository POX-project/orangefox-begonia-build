name: runner diag

on:
  push:
    branches:
      - fix/runner-limits
    paths:
      - '.github/workflows/runner-diag.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: cgroup enforcement
        run: |
          set +e
          echo "=== plain user scope MemoryMax=128M, alloc 512M ==="
          systemd-run --user --scope --quiet --collect \
            -p MemoryMax=128M -p MemorySwapMax=32M \
            timeout 60 python3 -c 'b=bytearray(512*1024*1024); print("allocated", len(b))'
          echo "rc=$?"
          echo
          echo "=== user scope with mka-like child (bash -> sleep) ==="
          systemd-run --user --scope --quiet --collect -p MemoryMax=4G -p MemorySwapMax=1G \
            bash -c 'echo "memory.max=$(cat /sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/memory.max)"; echo "memory.swap.max=$(cat /sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/memory.swap.max)"; echo "oom.group=$(cat /sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/memory.oom.group 2>/dev/null)"'
          echo "rc=$?"
          echo
          echo "=== does a SIGKILL inside the scope report 137 through a pipe? ==="
          set -o pipefail
          systemd-run --user --scope --quiet --collect -p MemoryMax=64M -p MemorySwapMax=0 \
            python3 -c 'b=bytearray(256*1024*1024)' 2>&1 | tail -3
          echo "pipestatus=$?"
      - name: free disk / inode math
        run: |
          set +e
          df -h / ; df -i / | tail -1
          echo "--- existing swap offline test ---"
          sudo swapoff /swapfile && echo "swapoff ok" || echo "swapoff failed"
          swapon --show
          free -h
