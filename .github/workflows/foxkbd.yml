name: foxkbd build

on:
  workflow_dispatch:
  push:
    branches: [wifi-browser]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/device_xiaomi_begonia-orangefox
          ref: net-fix
          path: device
          fetch-depth: 1

      - name: Install aarch64 cross compiler
        run: |
          # gcc-aarch64-linux-gnu is not used: it Conflicts with gcc-multilib in
          # the full build, so both workflows use clang + the cross sysroot.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross libgcc-11-dev-arm64-cross

      - name: Build static foxkbd
        run: |
          cd device
          test -x tools/build-foxkbd.sh
          WORK=/tmp/foxkbd-build ./tools/build-foxkbd.sh
          test -x recovery/root/system/bin/foxkbd
          file recovery/root/system/bin/foxkbd
          if readelf -d recovery/root/system/bin/foxkbd | grep -q NEEDED; then
            echo "::error::foxkbd is not statically linked"
            exit 1
          fi

      - name: Upload foxkbd
        uses: actions/upload-artifact@v4
        with:
          name: foxkbd-aarch64
          path: device/recovery/root/system/bin/foxkbd
          if-no-files-found: error
